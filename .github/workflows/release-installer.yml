name: Release installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./installer-rs -> target"
          cache-workspace-crates: "true"

      - name: Test the native installer
        run: cargo +1.94.1 test --locked --manifest-path installer-rs/Cargo.toml --all-features

  native:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./installer-rs -> target"
          cache-workspace-crates: "true"

      - name: Build the graphical installer
        run: >-
          cargo +1.94.1 build
          --locked
          --manifest-path installer-rs/Cargo.toml
          --release
          --features gui
          --bin sneakout-patches-gui

      - name: Stage the Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-native
          install -m 755 installer-rs/target/release/sneakout-patches-gui dist-native/SneakOutPatches-linux-x86_64
          cd dist-native
          sha256sum SneakOutPatches-linux-x86_64 > SneakOutPatches-linux-x86_64.sha256

      - name: Stage the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-native | Out-Null
          $binary = "dist-native/SneakOutPatches-windows-x86_64.exe"
          Copy-Item installer-rs/target/release/sneakout-patches-gui.exe $binary
          $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLower()
          "$hash  SneakOutPatches-windows-x86_64.exe" | Set-Content "$binary.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            dist-native/SneakOutPatches-linux-x86_64
            dist-native/SneakOutPatches-windows-x86_64.exe
            dist-native/*.sha256
          if-no-files-found: error

  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup +1.94.1 target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./installer-rs -> target"
          cache-workspace-crates: "true"
          cache-on-failure: "true"

      - name: Build the universal macOS launcher
        run: |
          cargo +1.94.1 build --locked --manifest-path installer-rs/Cargo.toml --release --target aarch64-apple-darwin --features macos-launcher --bin sneakout-patches-macos
          cargo +1.94.1 build --locked --manifest-path installer-rs/Cargo.toml --release --target x86_64-apple-darwin --features macos-launcher --bin sneakout-patches-macos

      - name: Verify the thin macOS launchers
        shell: bash
        run: |
          test -s installer-rs/target/aarch64-apple-darwin/release/sneakout-patches-macos
          test -s installer-rs/target/x86_64-apple-darwin/release/sneakout-patches-macos
          lipo -info installer-rs/target/aarch64-apple-darwin/release/sneakout-patches-macos
          lipo -info installer-rs/target/x86_64-apple-darwin/release/sneakout-patches-macos

      - name: Create the universal macOS launcher
        shell: bash
        run: |
          mkdir -p dist-macos
          lipo -create \
            installer-rs/target/aarch64-apple-darwin/release/sneakout-patches-macos \
            installer-rs/target/x86_64-apple-darwin/release/sneakout-patches-macos \
            -output dist-macos/SneakOutPatches

      - name: Verify the universal macOS launcher
        shell: bash
        run: |
          lipo -verify_arch arm64 x86_64 dist-macos/SneakOutPatches

      - uses: actions/upload-artifact@v4
        with:
          name: macos-launcher
          path: dist-macos/SneakOutPatches
          if-no-files-found: error

  package-macos:
    needs:
      - native
      - macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: native-Windows
          path: dist-native/windows

      - uses: actions/download-artifact@v4
        with:
          name: macos-launcher
          path: dist-macos

      - name: Package the macOS application
        shell: bash
        run: |
          app="dist-native/package/SneakOutPatches.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp dist-macos/SneakOutPatches "$app/Contents/MacOS/SneakOutPatches"
          chmod 755 "$app/Contents/MacOS/SneakOutPatches"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/SneakOutPatches"
          cp installer-rs/macos/Info.plist "$app/Contents/Info.plist"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' installer-rs/Cargo.toml | head -n 1)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"
          cp dist-native/windows/SneakOutPatches-windows-x86_64.exe "$app/Contents/Resources/SneakOutPatches.exe"
          test -s "$app/Contents/Resources/SneakOutPatches.exe"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist-native/SneakOutPatches-macos-universal.zip
          cd dist-native
          shasum -a 256 SneakOutPatches-macos-universal.zip > SneakOutPatches-macos-universal.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: native-macOS
          path: |
            dist-native/SneakOutPatches-macos-universal.zip
            dist-native/SneakOutPatches-macos-universal.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify installer version matches the release tag
        shell: bash
        run: |
          installer_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' installer-rs/Cargo.toml | head -n 1)"
          test "v${installer_version}" = "${GITHUB_REF_NAME}"

      - name: Find the successful main build for this commit
        id: build
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "release-installer.yml",
              branch: "main",
              event: "push",
              status: "success",
              head_sha: context.sha,
              per_page: 10,
            });
            const run = data.workflow_runs.find(candidate =>
              candidate.head_sha === context.sha && candidate.event === "push"
            );
            if (!run) {
              core.setFailed(
                `No successful main build found for tagged commit ${context.sha}. ` +
                "Push the release commit to main and let this workflow finish before tagging it."
              );
              return;
            }
            core.info(`Promoting artifacts from main workflow run ${run.id}.`);
            core.setOutput("run-id", String(run.id));

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run-id }}
          pattern: native-*
          path: dist/native
          merge-multiple: true

      - name: Verify the release assets
        shell: bash
        run: |
          expected_assets="$(printf '%s\n' \
            SneakOutPatches-linux-x86_64 \
            SneakOutPatches-linux-x86_64.sha256 \
            SneakOutPatches-macos-universal.zip \
            SneakOutPatches-macos-universal.zip.sha256 \
            SneakOutPatches-windows-x86_64.exe \
            SneakOutPatches-windows-x86_64.exe.sha256 | sort)"
          actual_assets="$(find dist/native -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual_assets" = "$expected_assets"
          cd dist/native
          sha256sum --check *.sha256

      - name: Build commit changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          toTag: ${{ github.ref_name }}
          failOnError: "true"
          configurationJson: |
            {
              "template": "## What's Changed\n\n#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}",
              "commit_template": "- #{{TITLE}}",
              "categories": [
                {
                  "title": "### Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "### Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "### Maintenance",
                  "labels": ["build", "chore", "ci", "docs", "perf", "refactor", "revert", "style", "test"]
                },
                {
                  "title": "### Other",
                  "labels": []
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.changelog }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/native/*
          --notes "${RELEASE_NOTES}"
          --verify-tag
