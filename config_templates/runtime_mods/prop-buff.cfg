[general]
## Allow slow movement and model cycling while transformed into a prop.
# Setting type: Boolean
# Default value: true
EnableMod = true

## Log successful prop model changes.
# Setting type: Boolean
# Default value: false
EnableLogging = false

[movement]
## Prop movement speed as a fraction of normal movement (0.05 to 0.75).
# Setting type: Single
# Default value: 0.05
SpeedMultiplier = 0.05

[models]
## Cycle the active prop model with the mouse wheel while transformed.
# Setting type: Boolean
# Default value: true
EnableMouseWheelCycling = true
