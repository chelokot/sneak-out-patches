name: Release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Test the native installer
        run: cargo +1.94.1 test --locked --manifest-path installer-rs/Cargo.toml --all-features

      - name: Build native release binaries
        run: >-
          cargo +1.94.1 build
          --locked
          --manifest-path installer-rs/Cargo.toml
          --release
          --features gui
          --bins

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-native/package
          install -m 755 installer-rs/target/release/sneakout-patches-gui dist-native/package/SneakOutPatches
          install -m 755 installer-rs/target/release/sneakout-patches dist-native/package/sneakout-patches
          tar -C dist-native/package -czf dist-native/SneakOutPatches-linux-x86_64.tar.gz SneakOutPatches sneakout-patches
          cd dist-native
          sha256sum SneakOutPatches-linux-x86_64.tar.gz > SneakOutPatches-linux-x86_64.tar.gz.sha256

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-native/package | Out-Null
          Copy-Item installer-rs/target/release/sneakout-patches-gui.exe dist-native/package/SneakOutPatches.exe
          Copy-Item installer-rs/target/release/sneakout-patches.exe dist-native/package/sneakout-patches.exe
          $archive = "dist-native/SneakOutPatches-windows-x86_64.zip"
          Compress-Archive -Path dist-native/package/* -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  SneakOutPatches-windows-x86_64.zip" | Set-Content "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            dist-native/*.tar.gz
            dist-native/*.zip
            dist-native/*.sha256
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true

      - name: Package the release payload
        run: python tools/package_installer_payload.py

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/sneakout-patches-payload.zip
          dist/sneakout-patches-payload.zip.sha256
          dist/native/*
          --generate-notes
          --verify-tag
