[package]
name = "sneakout-patches-installer"
version = "1.2.1"
edition = "2024"
autobins = false
description = "Native Sneak Out runtime mod installer"
repository = "https://github.com/chelokot/sneak-out-patches"

[lib]
name = "sneakout_installer"
path = "src/lib.rs"

[[bin]]
name = "sneakout-patches"
path = "src/bin/cli.rs"

[[bin]]
name = "sneakout-patches-gui"
path = "src/bin/gui_main.rs"
required-features = ["gui"]
test = false

[[bin]]
name = "sneakout-patches-macos"
path = "src/bin/macos_launcher.rs"
required-features = ["macos-launcher"]
test = false

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]
macos-launcher = ["dep:eframe", "dep:rfd"]
dev-mode = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
eframe = { version = "0.35", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
include_dir = "0.7"
path-absolutize = "3.1"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
walkdir = "2.5"
zip = { version = "8.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
assert_cmd = "2.1"
tempfile = "3.23"

[profile.release]
lto = false
strip = true
