[general]
## Settings file was created by version 0.2.0 of Free Fly
## Plugin GUID: chelokot.sneakout.free-fly
## Plugin Name: Free Fly
## Plugin Version: 0.1.0

## Enable local free-fly controls on PageUp and PageDown.
# Setting type: Boolean
# Default value: true
EnableMod = true

## Log local free-fly movement.
# Setting type: Boolean
# Default value: false
EnableLogging = true

[diagnostics]
## Move the local host through a repeatable Map02 route for unattended profiling. Never enable in a real match.
# Setting type: Boolean
# Default value: false
AutoTraverseMap02 = false

## World-space speed used by the unattended Map02 traversal probe.
# Setting type: Single
# Default value: 8
AutoTraverseSpeed = 8

## Number of forward/back Map02 traversal loops before the probe stops.
# Setting type: Int32
# Default value: 3
AutoTraverseLoops = 3

[movement]
## Vertical movement speed in units per second.
# Setting type: Single
# Default value: 8
MovementSpeed = 8

## Axis to move on. Y is the normal Unity vertical axis.
# Setting type: FreeFlyAxis
# Default value: Y
# Acceptable values: Y, Z
Axis = Y
