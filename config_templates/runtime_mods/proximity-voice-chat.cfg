[General]
## Settings file was created by version 0.1.0 of Proximity Voice Chat
## Plugin GUID: chelokot.sneakout.proximity-voice-chat
## Plugin Name: Proximity Voice Chat
## Plugin Version: 0.1.0

## Enable proximity voice chat.
# Setting type: Boolean
# Default value: true
Enabled = true

[Capture]
## Voice send mode.
# Setting type: VoiceTransmissionMode
# Default value: PushToTalk
# Acceptable values: PushToTalk, VoiceActivation, AlwaysOn
TransmissionMode = PushToTalk

## Physical push-to-talk key. It is layout-independent through Unity Input System.
# Setting type: KeyCode
# Default value: V
PushToTalkKey = V

## Allow microphone transmission while the game is not focused.
# Setting type: Boolean
# Default value: false
TransmitWhileUnfocused = false

## Never transmit while a text field is selected.
# Setting type: Boolean
# Default value: true
SuppressWhileTyping = true

## RMS threshold for voice activation.
# Setting type: Single
# Default value: 0.018
VoiceActivationThreshold = 0.018

## Seconds to keep transmitting after speech falls below the threshold.
# Setting type: Single
# Default value: 0.35
VoiceActivationHangoverSeconds = 0.35

## Seconds of audio retained before voice activation opens.
# Setting type: Single
# Default value: 0.16
VoiceActivationPreRollSeconds = 0.16

[Playback]
## Voice volume multiplier.
# Setting type: Single
# Default value: 1
MasterVolume = 1

## Distance at which voices play at full volume.
# Setting type: Single
# Default value: 2.5
MinimumDistance = 2.5

## Distance at which voices become inaudible.
# Setting type: Single
# Default value: 18
MaximumDistance = 18

## Baseline network playout delay in milliseconds.
# Setting type: Single
# Default value: 110
JitterBufferMilliseconds = 110

## Maximum adaptive playout delay in milliseconds.
# Setting type: Single
# Default value: 280
MaximumJitterMilliseconds = 280

## Muffle voices when level geometry blocks the direct path.
# Setting type: Boolean
# Default value: true
EnableOcclusion = true

## Volume multiplier behind geometry.
# Setting type: Single
# Default value: 0.68
OccludedVolumeMultiplier = 0.68

## Low-pass cutoff in hertz behind geometry.
# Setting type: Single
# Default value: 1800
OccludedLowPassFrequency = 1800

[Privacy]
## Comma-separated SteamID64 values that should never be played.
# Setting type: String
# Default value:
MutedSteamIds =

[Networking]
## Optional SteamID64 peers for non-friends when the game does not expose platform identity.
# Setting type: String
# Default value:
AdditionalPeerSteamIds =

[Diagnostics]
## Open the stock audio settings once and capture the proximity voice controls. Intended only for unattended visual regression testing.
# Setting type: Boolean
# Default value: false
CaptureSettingsScreenshot = false

## Write lifecycle and transport diagnostics. Voice payloads are never logged.
# Setting type: Boolean
# Default value: false
EnableLogging = false
