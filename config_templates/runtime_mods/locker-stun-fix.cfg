[general]
## Settings file was created by version 0.4.1 of Locker Stun Fix
## Plugin GUID: chelokot.sneakout.locker-stun-fix
## Plugin Name: Locker Stun Fix
## Plugin Version: 0.4.1

## Suppress Boo only when another player opened the occupied locker before the penguin exited.
# Setting type: Boolean
# Default value: true
EnableMod = true

## Log locker opener attribution and every Boo allow/suppress decision without player audio or other payload data.
# Setting type: Boolean
# Default value: true
EnableLogging = true

[visuals]
## Always show the native Boo sphere's floor-level cross-section and facing arrow on every regular locker.
# Setting type: Boolean
# Default value: true
HighlightStunZone = true

## Always show an amber floor area sampled from the native locker CanInteract predicate.
# Setting type: Boolean
# Default value: true
HighlightInteractionZone = true
