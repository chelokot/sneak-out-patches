## Plugin Name: Lobby Skill Sandbox
## Plugin Version: 0.2.1

## Enable the lobby-only penguin skill panel and supported lobby slide.
# Setting type: Boolean
# Default value: true
EnableMod = true

## Show the in-game penguin skill panel while in the lobby.
# Setting type: Boolean
# Default value: true
EnableLobbySkillUi = true

## Allow the local penguin to use slide and separately enabled experimental skills while in the lobby.
# Setting type: Boolean
# Default value: true
EnableLobbySkillUse = true

## Reserved for a future lobby-safe replication protocol. The stock match prop RPC is unsafe in Lobby.
# Setting type: Boolean
# Default value: false
EnableLobbyPropChange = false

## Log lobby penguin skill decisions.
# Setting type: Boolean
# Default value: false
EnableLogging = false
