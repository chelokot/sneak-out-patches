name: Release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Test the native installer
        run: cargo +1.94.1 test --locked --manifest-path installer-rs/Cargo.toml --all-features

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Build native release binaries
        run: >-
          cargo +1.94.1 build
          --locked
          --manifest-path installer-rs/Cargo.toml
          --release
          --features gui
          --bins

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-native
          install -m 755 installer-rs/target/release/sneakout-patches-gui dist-native/SneakOutPatches-linux-x86_64
          install -m 755 installer-rs/target/release/sneakout-patches dist-native/sneakout-patches-linux-x86_64
          cd dist-native
          sha256sum SneakOutPatches-linux-x86_64 > SneakOutPatches-linux-x86_64.sha256
          sha256sum sneakout-patches-linux-x86_64 > sneakout-patches-linux-x86_64.sha256

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-native | Out-Null
          $gui = "dist-native/SneakOutPatches-windows-x86_64.exe"
          $cli = "dist-native/sneakout-patches-windows-x86_64.exe"
          Copy-Item installer-rs/target/release/sneakout-patches-gui.exe $gui
          Copy-Item installer-rs/target/release/sneakout-patches.exe $cli
          foreach ($path in @($gui, $cli)) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
            $name = Split-Path -Leaf $path
            "$hash  $name" | Set-Content "$path.sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: dist-native/*
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true

      - name: Package the release payload
        run: python tools/package_installer_payload.py

      - name: Build commit changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          toTag: ${{ github.ref_name }}
          failOnError: "true"
          configurationJson: |
            {
              "template": "## What's Changed\n\n#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}",
              "commit_template": "- #{{TITLE}}",
              "categories": [
                {
                  "title": "### Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "### Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "### Maintenance",
                  "labels": ["build", "chore", "ci", "docs", "perf", "refactor", "revert", "style", "test"]
                },
                {
                  "title": "### Other",
                  "labels": []
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.changelog }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/sneakout-patches-payload.zip
          dist/sneakout-patches-payload.zip.sha256
          dist/native/*
          --notes "${RELEASE_NOTES}"
          --verify-tag
