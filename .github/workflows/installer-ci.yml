name: Installer CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run installer:test
      - run: npm run installer:payload
      - run: npm pack --dry-run
