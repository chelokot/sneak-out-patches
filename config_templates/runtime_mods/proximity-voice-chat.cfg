[General]
## Settings file was created by version 0.4.10 of Proximity Voice Chat
## Plugin GUID: chelokot.sneakout.proximity-voice-chat
## Plugin Name: Proximity Voice Chat
## Plugin Version: 0.4.10

## Enable proximity voice chat.
# Setting type: Boolean
# Default value: true
Enabled = true

[Capture]
## Voice send mode.
# Setting type: VoiceTransmissionMode
# Default value: PushToTalk
# Acceptable values: PushToTalk, VoiceActivation, AlwaysOn
TransmissionMode = PushToTalk

## Unity microphone device name. Empty uses the current system default.
# Setting type: String
# Default value:
MicrophoneDevice =

## Unity Input System keyboard binding used by push-to-talk. Record a key in Audio settings.
# Setting type: String
# Default value: <Keyboard>/v
PushToTalkBinding = <Keyboard>/v

## Stop microphone transmission while the game window is not focused.
# Setting type: Boolean
# Default value: true
StopWhenGameIsUnfocused = true

## RMS threshold for voice activation.
# Setting type: Single
# Default value: 0.018
VoiceActivationThreshold = 0.018

## Seconds to keep transmitting after speech falls below the threshold.
# Setting type: Single
# Default value: 0.35
VoiceActivationHangoverSeconds = 0.35

## Seconds of audio retained before voice activation opens.
# Setting type: Single
# Default value: 0.16
VoiceActivationPreRollSeconds = 0.16

## Outgoing microphone volume applied before Opus encoding. This changes what other players receive.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
MicrophoneVolume = 1

[Playback]
## Default voice volume for party members without a saved per-player override. 100% is the original receive baseline.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
MasterVolume = 1

## Saved per-player voice volumes as SteamID64=multiplier pairs. Managed by Audio settings.
# Setting type: String
# Default value:
PlayerVolumes =

## Pan remote voices toward their world-space direction. Distance and occlusion volume remain active when disabled.
# Setting type: Boolean
# Default value: true
DirectionalVoice = true

## Baseline network playout delay in milliseconds.
# Setting type: Single
# Default value: 110
JitterBufferMilliseconds = 110

## Maximum adaptive playout delay in milliseconds.
# Setting type: Single
# Default value: 280
MaximumJitterMilliseconds = 280

[Privacy]
## Comma-separated SteamID64 values that should never be played.
# Setting type: String
# Default value:
MutedSteamIds =

[Networking]
## Optional SteamID64 peers for non-friends when the game does not expose platform identity.
# Setting type: String
# Default value:
AdditionalPeerSteamIds =

[Diagnostics]
## Open the stock audio settings once and capture the proximity voice controls. Intended only for unattended visual regression testing.
# Setting type: Boolean
# Default value: false
CaptureSettingsScreenshot = false

## Write lifecycle and transport diagnostics. Voice payloads are never logged.
# Setting type: Boolean
# Default value: false
EnableLogging = false
