## Settings file was created by version 0.1.0 of Chair Wall Throw Fix
## Plugin GUID: chelokot.sneakout.chair-wall-throw-fix
## Plugin Name: Chair Wall Throw Fix
## Plugin Version: 0.1.0

## Let a held chair leave the player's hands when its release position slightly overlaps level geometry.
# Setting type: Boolean
# Default value: true
EnableMod = true

## Maximum distance in metres that an overlapping held chair may be moved back toward its thrower before the stock throw runs.
# Setting type: Single
# Default value: 0.65
# Acceptable value range: From 0.1 to 1
MaximumReleaseCorrection = 0.65

## Log each corrected chair release position.
# Setting type: Boolean
# Default value: false
EnableLogging = false
