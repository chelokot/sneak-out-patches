[general]
## Settings file was created by version 0.4.0 of Lobby Test Bot
## Plugin GUID: chelokot.sneakout.lobby-test-bot
## Plugin Name: Lobby Test Bot
## Plugin Version: 0.4.0

## Show the host-only portal button, spawn one real inert network player, and allow a private test match to start with it.
# Setting type: Boolean
# Default value: true
EnableMod = true

[diagnostics]
## Open the stock portal UI automatically after lobby initialization for unattended UI testing.
# Setting type: Boolean
# Default value: false
AutoOpenPortalWhenLobbyReady = false

## Capture the game framebuffer shortly after diagnostic portal opening into BepInEx/ui-captures.
# Setting type: Boolean
# Default value: false
CapturePortalScreenshot = false

## Automatically add the bot after the host and player registry are ready. Intended for repeatable runtime testing.
# Setting type: Boolean
# Default value: false
AutoAddBotWhenLobbyReady = false

## After diagnostic auto-add succeeds, switch the stock portal to a private game and invoke its real PLAY callback.
# Setting type: Boolean
# Default value: false
AutoStartPrivateMatchWhenBotReady = false

## Delay after the authoritative bot is ready before the stock private-game and PLAY callbacks are invoked.
# Setting type: Single
# Default value: 3
AutoStartDelaySeconds = 3

## Mode selected through the real portal mode button before diagnostic auto-start. Preserve keeps the current UI choice.
# Setting type: DiagnosticGameMode
# Default value: Preserve
# Acceptable values: Preserve, Classic, Crown
AutoStartGameMode = Preserve

## Map forced only for diagnostic auto-start. Random preserves normal portal selection.
# Setting type: DiagnosticMap
# Default value: Random
# Acceptable values: Random, Map01, Map02, Map03, Map04, MapEast01, MapEast02, MapSchool01, MapSchool02
AutoStartMap = Random

## Log lobby bot eligibility and authoritative spawn state.
# Setting type: Boolean
# Default value: false
EnableLogging = false

[bot]
## Nickname used for the managed lobby bot.
# Setting type: String
# Default value: TEST BOT
Nickname = TEST BOT
